# NodeTexeure — Docker PRODUCTION stack.
#   Provide secrets via a .env file next to this one (gitignored) or the shell:
#     DB_PASSWORD=... JWT_SECRET=... NEXTAUTH_SECRET=... NEXTAUTH_URL=https://...
#   Build + run:  docker compose -f docker-compose.prod.yml up -d --build
# First deploy initializes the schema from docker/mysql/init.sql; the backend then
# applies backend/migrations on every start. It does NOT auto-seed.
# Integration credentials (Stripe webhook secret, SES, S3, FedEx, SENTRY_DSN,
# CORS_ORIGINS, ...) go in backend/.env — see backend/.env.example and docs/DEPLOYMENT.md.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_DATABASE: bed_texture_ecommerce
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PORT: "6666"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      # TRUST_PROXY (rate-limit client IP) comes from backend/.env: opt in with 1
      # only when 3000/3005 are reachable solely through a TLS proxy that sets
      # X-Forwarded-For (docs/DEPLOYMENT.md).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    expose:
      - "6666"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 503 when MySQL is unreachable (see routes/statusRoutes.js).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6666/api/status/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        PRODUCTION_BACKEND_URL: http://backend:6666
        RUST_API_URL: http://api:7000
        RUST_API_ROUTES: ${RUST_API_ROUTES-products,search,journal,settings/public,wishlist,orders,cart,users,reviews,returns,abandoned-cart,unsubscribe,newsletter,contact,status,shipping}
    environment:
      PRODUCTION_BACKEND_URL: http://backend:6666
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      api:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile.prod
      # Baked into the build (admin-dashboard/rustRoutes.mjs). Empty
      # ADMIN_RUST_API_ROUTES = every admin /api call stays on Node.
      args:
        BACKEND_URL: http://backend:6666
        RUST_API_URL: http://api:7000
        RUST_API_ROUTES: ${ADMIN_RUST_API_ROUTES-}
    environment:
      BACKEND_URL: http://backend:6666
      NODE_ENV: production
    ports:
      - "3005:3005"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      api:
        condition: service_healthy

  # Rust API: serves the route groups in RUST_API_ROUTES (baked into the
  # frontend build below); unset them to send everything back to Node.
  api:
    build:
      context: ./rust
    command: ["api"]
    # Same backend/.env as the Node backend: the groups served here read
    # FEDEX_*, FRONTEND_URL, CSRF_SECRET, ACCESS_TOKEN_TTL, the rate-limit and
    # cookie TTL settings, so both services must see the same values.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      API_PORT: "7000"
      # Must match the backend: the API verifies the tokens Node signs.
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # TRUST_PROXY (rate-limit client IP) comes from backend/.env: opt in with 1
      # only when 3000/3005 are reachable solely through a TLS proxy that sets
      # X-Forwarded-For (docs/DEPLOYMENT.md).
    expose:
      - "7000"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Rust email daemon: the only consumer of email_queue (SES credentials and
  # sender settings come from backend/.env).
  email-daemon:
    build:
      context: ./rust
    command: ["email-daemon"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_prod_data:
