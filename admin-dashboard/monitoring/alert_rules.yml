# Prometheus alert rules for Admin Dashboard

groups:
  - name: admin-dashboard-alerts
    rules:
      # High memory usage
      - alert: HighMemoryUsage
        expr: (nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: admin-dashboard
        annotations:
          summary: "Admin Dashboard high memory usage"
          description: "Memory usage is above 90% for more than 5 minutes"

      # Service down
      - alert: ServiceDown
        expr: up{job="admin-dashboard"} == 0
        for: 1m
        labels:
          severity: critical
          service: admin-dashboard
        annotations:
          summary: "Admin Dashboard is down"
          description: "Admin Dashboard has been down for more than 1 minute"

      # High response time
      - alert: HighResponseTime
        expr: avg_over_time(http_request_duration_seconds[5m]) > 2
        for: 5m
        labels:
          severity: warning
          service: admin-dashboard
        annotations:
          summary: "Admin Dashboard high response time"
          description: "Average response time is above 2 seconds for 5 minutes"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
        annotations:
          summary: "Admin Dashboard high error rate"
          description: "Error rate is above 10% for 5 minutes"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%"

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      # SSL certificate expiring
      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate will expire in less than 30 days"

  - name: system-alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for more than 5 minutes"

      # High load average
      - alert: HighLoadAverage
        expr: node_load1 > 2
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High load average"
          description: "Load average is above 2 for more than 5 minutes"

      # Out of memory
      - alert: OutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Out of memory"
          description: "Available memory is below 10%"