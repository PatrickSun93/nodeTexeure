# The production stack of docker-compose.prod.yml as Kubernetes objects.
# Everything lives in one namespace; Service names match the URLs baked into
# the frontend and admin images (http://backend:6666, http://api:7000).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nodetexeure

labels:
  - pairs:
      app.kubernetes.io/part-of: nodetexeure

resources:
  - namespace.yaml
  - mysql.yaml
  - uploads.yaml
  - backend.yaml
  - api.yaml
  - worker.yaml
  - email-daemon.yaml
  - frontend.yaml
  - admin-dashboard.yaml
  - ingress.yaml
