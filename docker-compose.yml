# NodeTexeure — Docker dev stack.
#   docker compose up          -> mysql + backend + frontend + admin, hot-reload
#   docker compose up mysql backend frontend   -> storefront only
# First run: MySQL initializes the schema from docker/mysql/init.sql and the
# backend auto-seeds demo data. Open http://localhost:3000.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-noirae_dev}
      MYSQL_DATABASE: bed_texture_ecommerce
    ports:
      - "3307:3306" # host 3307 to avoid clashing with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-noirae_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-noirae_dev}
      PORT: "6666"
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_change_me_min_32_characters}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_only_nextauth_secret}
    ports:
      - "6666:6666"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://backend:6666
      RUST_API_URL: http://api:7000
      RUST_API_ROUTES: products,search,journal,settings,wishlist,orders,cart,users,reviews,returns,abandoned-cart,unsubscribe,newsletter,contact,status,shipping,admin,database,payments,images
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_only_nextauth_secret}
      NODE_ENV: development
      WATCHPACK_POLLING: "true" # reliable hot-reload over the macOS bind mount
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
      - api

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_URL: http://backend:6666
      # Same mechanism as the frontend (admin-dashboard/rustRoutes.mjs): these
      # groups go to the Rust API, the rest of /api to Node. Empty
      # RUST_API_ROUTES = every admin /api call stays on Node (rollback).
      RUST_API_URL: http://api:7000
      RUST_API_ROUTES: admin,database,settings,payments,images,users
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3005:3005"
    volumes:
      - ./admin-dashboard:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    depends_on:
      - backend
      - api

  # Rust API (rust/crates/api): answers the route groups listed in the
  # frontend's and the admin's RUST_API_ROUTES; everything else stays on the
  # Node backend.
  api:
    build:
      context: ./rust
    command: ["api"]
    # Same settings the Node backend reads (FedEx, FRONTEND_URL, limits, TTLs);
    # `environment:` below still wins for DB_*, NODE_ENV and JWT_SECRET.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-noirae_dev}
      API_PORT: "7000"
      # Must match the backend: the API verifies the tokens Node signs.
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_change_me_min_32_characters}
      # /api/images and admin product images write here; the backend serves the
      # same directory at /uploads (it is ./backend/uploads in both containers).
      UPLOADS_DIR: /uploads
    user: root # write to the bind-mounted uploads regardless of host ownership
    volumes:
      - ./backend/uploads:/uploads
    ports:
      - "7000:7000"
    depends_on:
      mysql:
        condition: service_healthy

  # Rust email daemon (rust/crates/email-daemon): delivers email_queue. Without
  # SES keys it writes each email to ./backend/email-outbox as an HTML file.
  email-daemon:
    build:
      context: ./rust
    command: ["email-daemon"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bed_texture_ecommerce
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-noirae_dev}
      EMAIL_TRANSPORT: outbox
      EMAIL_OUTBOX_DIR: /outbox
    user: root # write to the bind-mounted outbox regardless of host ownership
    volumes:
      - ./backend/email-outbox:/outbox
    depends_on:
      - backend # waits itself until the backend has applied migrations

volumes:
  mysql_data:
  backend_node_modules:
  frontend_node_modules:
  admin_node_modules:
  frontend_next:
  admin_next:
