<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:ital@0;1&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F3EBDD;color:#2A2621;font-family:'Jost',-apple-system,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;color:#2A2621;line-height:1.08}
p{margin:0}
input::placeholder{color:#B4A990}
</style>
</helmet>

<div style="min-height:100vh;display:grid;grid-template-columns:1.05fr 0.95fr;background:#F3EBDD;">

<div style="position:relative;overflow:hidden;min-height:100vh;background:#ECDCC4;">
<img src="https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?auto=format&fit=crop&q=80&w=1300" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,22,18,0.5) 0%,rgba(26,22,18,0.12) 34%,rgba(26,22,18,0.6) 100%);"></div>
<a href="Noiraé — Home.dc.html" style="position:absolute;top:36px;left:44px;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;letter-spacing:0.14em;color:#F7EFE1;">Noiraé</a>
<div style="position:absolute;left:44px;right:44px;bottom:48px;color:#F7EFE1;">
<div style="font-family:'Cormorant Garamond',serif;font-size:32px;line-height:1.25;max-width:420px;font-weight:500;">Rest easy — we'll help you back in.</div>
<div style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#DCC08A;margin-top:18px;">Silk &amp; Cashmere</div>
</div>
</div>

<div style="display:flex;flex-direction:column;padding:34px 44px;">
<div style="display:flex;justify-content:flex-end;">
<a href="Noiraé — Login.dc.html" style="font-size:12px;letter-spacing:0.06em;color:#6A6156;display:flex;align-items:center;gap:7px;transition:color .2s;" style-hover="color:#2A2621"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="14 6 8 12 14 18"/></svg>Back to sign in</a>
</div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;max-width:400px;width:100%;margin:0 auto;padding:36px 0;">
<div style="font-size:11px;letter-spacing:0.26em;text-transform:uppercase;color:#A8863F;">Reset</div>
<h1 style="font-size:42px;margin-top:12px;letter-spacing:-0.01em;">Forgot password?</h1>
<p style="font-size:14.5px;line-height:1.6;color:#6A6156;margin-top:12px;">Enter the email linked to your account and we'll send you a secure link to reset your password.</p>
<form onSubmit="{{ onSubmit }}" style="margin-top:30px;display:flex;flex-direction:column;gap:18px;">
<div>
<label style="display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#6A6156;margin-bottom:8px;">Email</label>
<input type="email" placeholder="you@example.com" style="width:100%;background:#FBF6EE;border:1px solid #D6C4A8;padding:14px 15px;font-family:'Jost',sans-serif;font-size:14px;color:#2A2621;outline:none;transition:border-color .2s;" style-focus="border-color:#A8863F" />
</div>
<button type="submit" style="width:100%;background:#2A2621;color:#F3EBDD;height:52px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;transition:background .25s;" style-hover="background:#A8863F">Send reset link</button>
</form>
<div style="margin-top:22px;display:flex;gap:9px;align-items:flex-start;background:#F6EFE3;border:1px solid #E7DBC6;padding:14px 16px;font-size:12.5px;color:#6A6156;line-height:1.55;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8863F" stroke-width="1.4" style="flex:0 0 auto;margin-top:1px;"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>The link expires in 30 minutes. Check your spam folder if it doesn't arrive.</div>
<div style="text-align:center;margin-top:26px;font-size:13.5px;color:#6A6156;">Remembered it? <a href="Noiraé — Login.dc.html" style="color:#2A2621;border-bottom:1px solid #C9B48C;padding-bottom:2px;" style-hover="color:#A8863F">Sign in</a></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){ return { onSubmit: function(e){ e.preventDefault(); } }; }
}
</script>
</body>
</html>
